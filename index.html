<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digitales Spielbrett</title>
  <style>
    :root {
      --board-size: 10;
      --cell-size: 52px;
      --gap: 6px;
      --bg: #121826;
      --panel: #1d263b;
      --border: #2d3a52;
      --text: #edf3ff;
      --shadow: rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .board-wrapper {
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 12px 30px var(--shadow);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 1.5rem;
      letter-spacing: 0.04em;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(var(--board-size), var(--cell-size));
      gap: var(--gap);
      background: #0b1220;
      border-radius: 12px;
      padding: 12px;
      border: 2px solid rgba(255,255,255,0.06);
    }

    .cell {
      width: var(--cell-size);
      height: var(--cell-size);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .cell:hover {
      transform: translateY(-1px) scale(1.02);
      border-color: rgba(255,255,255,0.35);
    }

    .cell.selected {
      outline: 3px solid rgba(255,255,255,0.9);
      outline-offset: 2px;
    }

    .legend {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      justify-content: center;
      font-size: 0.9rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0.9;
    }

    .legend-swatch {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      display: inline-block;
      border: 1px solid rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>
  <div class="board-wrapper">
    <h1>Spielbrett</h1>
    <div id="board" class="board" aria-label="Spielbrett"></div>

    <div class="legend">
      <div class="legend-item"><span class="legend-swatch" style="background:#ef4444"></span>Rot</div>
      <div class="legend-item"><span class="legend-swatch" style="background:#3b82f6"></span>Blau</div>
      <div class="legend-item"><span class="legend-swatch" style="background:#22c55e"></span>Grün</div>
      <div class="legend-item"><span class="legend-swatch" style="background:#facc15"></span>Gelb</div>
      <div class="legend-item"><span class="legend-swatch" style="background:#a855f7"></span>Lila</div>
      <div class="legend-item"><span class="legend-swatch" style="background:#f97316"></span>Orange</div>
    </div>
  </div>

  <script>
    const board = document.getElementById("board");
    const boardSize = 10;
    const colors = ["#ef4444", "#3b82f6", "#22c55e", "#facc15", "#a855f7", "#f97316"];

    function createBoard() {
      for (let i = 0; i < boardSize * boardSize; i++) {
        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = "cell";
        cell.style.background = colors[Math.floor(Math.random() * colors.length)];
        cell.setAttribute("aria-label", `Feld ${i + 1}`);

        cell.addEventListener("click", () => {
          const selected = document.querySelector(".cell.selected");
          if (selected) selected.classList.remove("selected");
          cell.classList.add("selected");
        });

        board.appendChild(cell);
      }
    }

    createBoard();
  </script>
</body>
</html>
