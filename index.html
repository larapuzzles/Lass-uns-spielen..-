<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leadership Board – Managementspiel</title>
    <style>
      :root {
        --bg: #edf2f7;
        --panel: #ffffff;
        --panel-strong: #f7f9fc;
        --border: #dbe4ef;
        --text: #1f2937;
        --muted: #5f6f82;
        --shadow: rgba(15, 23, 42, 0.08);

        --blue: #2f6fcb;
        --blue-soft: #dfeeff;
        --red: #d84d4d;
        --red-soft: #ffe0e0;
        --green: #2f9e6f;
        --green-soft: #dff5e8;
        --yellow: #d9a92a;
        --yellow-soft: #fff3d4;

        --board-bg: #eef3f8;
        --primary: #1f4e79;
        --dark: #1d2430;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #edf3fb, #f5f7fa);
        color: var(--text);
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .app {
        width: min(98vw, 1220px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 28px;
        box-shadow: 0 22px 46px var(--shadow);
        padding: 20px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }

      .title-group h1 {
        margin: 0;
        font-size: clamp(1.6rem, 2.2vw, 2.3rem);
        letter-spacing: 0.02em;
      }

      .subtitle {
        margin-top: 6px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .controls label {
        font-size: 0.8rem;
        color: var(--muted);
      }

      select, button {
        border-radius: 12px;
        border: 1px solid var(--border);
        padding: 10px 14px;
        background: #fff;
        color: var(--text);
        font-size: 0.95rem;
      }

      button {
        background: linear-gradient(135deg, #1f4e79, #2d6fa3);
        color: white;
        border: none;
        cursor: pointer;
        font-weight: 600;
        letter-spacing: 0.02em;
        box-shadow: 0 10px 20px rgba(31, 78, 121, 0.2);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 24px rgba(31, 78, 121, 0.24);
      }

      .statusbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        background: var(--panel-strong);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 14px 18px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }

      .status-text {
        font-weight: 600;
      }

      .dice-display {
        min-width: 130px;
        text-align: center;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 8px 12px;
        font-weight: 700;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(440px, 2fr) minmax(280px, 1fr);
        gap: 18px;
      }

      .board-wrap {
        background: var(--board-bg);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 18px;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(6, minmax(72px, 1fr));
        gap: 12px;
      }

      .tile {
        position: relative;
        aspect-ratio: 1 / 1;
        border-radius: 16px;
        border: 1px solid rgba(255,255,255,0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: inset 0 0 0 1px rgba(17, 24, 39, 0.04);
        overflow: hidden;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .tile:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 18px rgba(15, 23, 42, 0.08);
      }

      .tile.active {
        outline: 3px solid rgba(17, 24, 39, 0.7);
        outline-offset: -3px;
      }

      .tile-content {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 6px;
        font-weight: 700;
        color: rgba(17, 24, 39, 0.75);
        position: relative;
      }

      .tile-content small {
        font-size: 0.56rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .tile-content strong {
        font-size: clamp(0.56rem, 1vw, 0.82rem);
        line-height: 1.1;
      }

      .tokens {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .token {
        position: absolute;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,0.95);
        box-shadow: 0 3px 8px rgba(0,0,0,0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.62rem;
        color: #fff;
        font-weight: 700;
        left: 50%;
        bottom: 10px;
        transform: translateX(var(--offset, 0px));
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #f7f9fc;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 7px 12px;
        font-size: 0.82rem;
        color: var(--muted);
      }

      .legend-mark {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        display: inline-block;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .panel {
        background: var(--panel-strong);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px;
      }

      .panel h3 {
        margin: 0 0 12px;
        font-size: 1rem;
      }

      .player-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .player-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        background: white;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 0.9rem;
      }

      .player-meta {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .player-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-block;
        border: 2px solid rgba(255,255,255,0.8);
      }

      .player-item.active {
        border-color: rgba(31, 78, 121, 0.5);
        background: #eef5ff;
      }

      .timer-panel {
        position: relative;
      }

      .sandglass {
        position: relative;
        width: 125px;
        height: 165px;
        margin: 8px auto 12px auto;
        background: linear-gradient(to bottom, #f6faff, #eef5ff);
        border: 4px solid #1c3047;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.7);
      }

      .sandglass::before,
      .sandglass::after {
        content: "";
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: 72%;
        height: 24%;
        background: rgba(30, 64, 175, 0.08);
      }

      .sandglass::before {
        top: 8px;
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      }

      .sandglass::after {
        bottom: 8px;
        clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
      }

      .sand-top,
      .sand-bottom {
        position: absolute;
        left: 13px;
        right: 13px;
        border-radius: 10px;
        background: linear-gradient(180deg, rgba(255, 184, 77, 0.92), rgba(245, 122, 58, 0.92));
        transition: height 0.2s ease;
      }

      .sand-top {
        top: 10px;
        height: 46%;
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      }

      .sand-bottom {
        bottom: 10px;
        height: 46%;
        clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
      }

      .timer-display {
        text-align: center;
        font-size: clamp(1.2rem, 2vw, 1.7rem);
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--primary);
      }

      .timer-note {
        text-align: center;
        font-size: 0.78rem;
        color: var(--muted);
        margin-top: 6px;
      }

      .card-box {
        background: linear-gradient(180deg, #fff, #f8fbff);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px;
      }

      .card-badge {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .card-title {
        margin: 12px 0 8px;
        font-size: 1.08rem;
        font-weight: 700;
      }

      .card-situation {
        margin: 0 0 12px;
        color: var(--text);
        line-height: 1.5;
        font-size: 0.92rem;
      }

      .group-impulses {
        margin-top: 10px;
        padding-left: 18px;
        color: var(--dark);
        font-size: 0.88rem;
        line-height: 1.55;
      }

      .card-question {
        margin: 12px 0 0;
        color: var(--primary);
        font-weight: 700;
        line-height: 1.45;
        font-size: 0.95rem;
      }

      .card-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 14px;
      }

      .small-btn {
        flex: 1 1 120px;
      }

      @media (max-width: 920px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 720px) {
        .board {
          grid-template-columns: repeat(4, minmax(70px, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="title-group">
          <h1>Leadership Board</h1>
          <div class="subtitle">Management-Lernspiel für Führungs- und Teamgespräche</div>
        </div>

        <div class="controls">
          <label for="playerCount">Teilnehmer</label>
          <select id="playerCount">
            <option value="2">2 Personen</option>
            <option value="4" selected>4 Personen</option>
            <option value="6">6 Personen</option>
          </select>
          <button id="rollButton" type="button">Würfeln</button>
          <button id="drawCardButton" type="button">Karte ziehen</button>
          <button id="nextTurnButton" type="button">Nächster Spieler</button>
        </div>
      </div>

      <div class="statusbar">
        <div class="status-text" id="statusText">Spieler 1 ist am Zug</div>
        <div class="dice-display" id="diceDisplay">Würfel: –</div>
      </div>

      <div class="layout">
        <div class="board-wrap">
          <div class="board" id="board"></div>*
