<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digitales Lernspielbrett</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --border: #d8e0ec;
        --text: #1f2937;
        --shadow: rgba(0, 0, 0, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eaf3ff, #f5f8ff);
        color: var(--text);
      }

      .app {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 18px 35px var(--shadow);
        padding: 20px;
        width: min(90vw, 720px);
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
      }

      .legend {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.8rem;
        background: #f3f6fb;
        border: 1px solid #dfe7f2;
        border-radius: 999px;
        padding: 6px 10px;
      }

      .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        display: inline-block;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(6, minmax(70px, 1fr));
        gap: 10px;
        background: #ebf0f7;
        border-radius: 18px;
        padding: 10px;
      }

      .tile {
        position: relative;
        aspect-ratio: 1 / 1;
        border-radius: 16px;
        border: 2px solid rgba(255, 255, 255, 0.6);
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.04);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        user-select: none;
        overflow: hidden;
      }

      .tile:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
      }

      .tile span {
        font-weight: 700;
        font-size: clamp(0.65rem, 1vw, 0.95rem);
        color: rgba(0, 0, 0, 0.7);
        text-align: center;
        padding: 6px;
      }

      .tile .marker {
        position: absolute;
        bottom: 7px;
        right: 7px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.8);
        border: 2px solid rgba(0, 0, 0, 0.08);
      }

      .tile.active {
        outline: 4px solid #111827;
        outline-offset: -4px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <h1>Spielbrett</h1>
        <div class="legend" id="legend"></div>
      </div>

      <div class="board" id="board"></div>
    </div>

    <script>
      const board = document.getElementById("board");
      const legend = document.getElementById("legend");

      const fieldTypes = [
        { name: "Start", color: "#f9d75d", label: "Start" },
        { name: "Mathe", color: "#6ec6ff", label: "1+1" },
        { name: "Sprache", color: "#ff9b8a", label: "Wort" },
        { name: "Natur", color: "#7adf9c", label: "Pflanze" },
        { name: "Technik", color: "#b38bff", label: "Code" },
        { name: "Kreativ", color: "#ffbf69", label: "Kunst" },
        { name: "Bonus", color: "#9fe4d8", label: "Bonus" },
        { name: "Ziel", color: "#f7a8d8", label: "Ziel" }
      ];

      // Legende erzeugen
      fieldTypes.forEach(type => {
        const item = document.createElement("div");
        item.className = "legend-item";
        item.innerHTML = `
          <span class="dot" style="background:${type.color}"></span>
          <span>${type.name}</span>
        `;
        legend.appendChild(item);
      });

      // 6x6 Spielbrett erstellen
      const size = 6;
      let currentIndex = 0;

      for (let i = 0; i < size * size; i++) {
        const tile = document.createElement("div");
        const type = fieldTypes[i % fieldTypes.length];

        tile.className = "tile";
        tile.style.background = type.color;
        tile.innerHTML = `
          <span>${type.label}</span>
          <div class="marker"></div>
        `;

        // Aktives Feld markiert
        if (i === currentIndex) {
          tile.classList.add("active");
        }

        tile.addEventListener("click", () => {
          document.querySelectorAll(".tile").forEach(cell => cell.classList.remove("active"));
          tile.classList.add("active");
          currentIndex = i;
        });

        board.appendChild(tile);
      }
    </script>
  </body>
</html>
