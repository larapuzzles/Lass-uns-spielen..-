<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Brettspiel</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
        }

        .spielbrett {
            width: 500px;
            height: 500px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 5px;
            background-color: #222;
            padding: 5px;
            border-radius: 10px;
        }

        .feld {
            background-color: #f1c40f;
            border: 2px solid #d4ac0d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #333;
            border-radius: 5px;
        }

        .feld:nth-child(even) {
            background-color: #e67e22;
        }

        .spieler {
            width: 35px;
            height: 35px;
            background-color: red;
            border-radius: 50%;
            border: 3px solid white;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2ecc71;
        }
    </style>
</head>

<body>

    <h1>🎲 Mein Brettspiel</h1>

    <div class="spielbrett">

        <div class="feld">START</div>
        <div class="feld"></div>
        <div class="feld"></div>
        <div class="feld"></div>
        <div class="feld"></div>

        <div class="feld"></div>
        <div class="feld"></div>
        <div class="feld"></div>
        <div class="feld"></div>
        <div class="feld"></div>

        <div class="feld"></div>
        <div class="feld"></div>
        <div class="feld">
            <div class="spieler"></div>
        </div>
        <div class="feld"></div>
        <div class="feld"></div>

        <div class="feld"></div>
        <div class="feld"></div>
        <div class="feld"></div>
        <div class="feld"></div>
        <div class="feld"></div>

        <div class="feld"></div>
        <div class="feld"></div>
        <div class="feld"></div>
        <div class="feld"></div>
        <div class="feld">ZIEL</div>

    </div>

    <button onclick="würfeln()">🎲 Würfeln</button>

    <p id="ergebnis">Du hast noch nicht gewürfelt.</p>

    <script>
        function würfeln() {
            let zahl = Math.floor(Math.random() * 6) + 1;

            document.getElementById("ergebnis").textContent =
                "Du hast eine " + zahl + " gewürfelt!";
        }
    </script>

</body>
</html>
